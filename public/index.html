<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>식전영상 에디터 – 클래식 모던</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300;0,400;0,500;1,300;1,400&family=IBM+Plex+Sans+KR:wght@400;500;600&family=Nanum+Myeongjo:wght@400;700&family=Pinyon+Script&family=Gowun+Batang:wght@400;700&family=Gowun+Dodum&family=Hahmlet:wght@300;400;600&family=Noto+Sans+KR:wght@300;400;600&family=Nanum+Pen+Script&family=Great+Vibes&family=VT323&family=Jua&family=Gaegu:wght@400;700&family=Pacifico&family=Playfair+Display:ital,wght@0,500;0,700;0,800;1,700&display=swap" rel="stylesheet">
<style>
:root{
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px);
  padding-bottom:env(safe-area-inset-bottom,0px);
  --bg:#E9E8E5; --surface:#FFFFFF; --sunk:#F3F2F0; --text:#1E1D1C; --muted:#6F6A65;
  --line:#D6D3CE; --accent:#7B2C3A; --accent-ink:#FFFFFF; --accent-soft:rgba(123,44,58,.09);
  color-scheme:light;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#121212; --surface:#1C1C1C; --sunk:#252525; --text:#ECEAE7; --muted:#A39D97;
    --line:#343231; --accent:#D59AA6; --accent-ink:#1B1214; --accent-soft:rgba(213,154,166,.12);
    color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#121212; --surface:#1C1C1C; --sunk:#252525; --text:#ECEAE7; --muted:#A39D97;
  --line:#343231; --accent:#D59AA6; --accent-ink:#1B1214; --accent-soft:rgba(213,154,166,.12);
  color-scheme:dark;
}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*,*::before,*::after{box-sizing:border-box}
html,body{margin:0}
body{background:var(--bg);color:var(--text);font:400 14px/1.55 "IBM Plex Sans KR",system-ui,-apple-system,sans-serif;-webkit-font-smoothing:antialiased}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}

.top{display:flex;align-items:center;gap:16px;flex-wrap:wrap;max-width:1520px;margin:0 auto;padding:18px 20px 6px}
.brand{display:flex;align-items:baseline;gap:12px;margin-right:auto}
.brand b{font:italic 400 34px/1 "Cormorant Garamond",Georgia,serif;letter-spacing:.01em}
.brand span{color:var(--muted);font-size:13px}
.btn{border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:8px 16px;font-weight:500;display:inline-flex;align-items:center;gap:8px;white-space:nowrap}
.btn:hover{border-color:var(--muted)}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.btn.small{padding:5px 12px;font-size:13px}
.btn.ghost{background:transparent}
.btn[disabled]{opacity:.45;cursor:not-allowed}
.audio-chip{display:inline-flex;align-items:center;gap:8px;font-size:13px;color:var(--muted);max-width:340px}
.audio-chip strong{color:var(--text);font-weight:500;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}

.app{max-width:1520px;margin:0 auto;padding:10px 20px 40px;display:grid;grid-template-columns:minmax(0,1fr) 390px;gap:20px;align-items:start}
@media (max-width:980px){.app{grid-template-columns:minmax(0,1fr)}}

.stage{background:#000;border-radius:8px;overflow:hidden;position:relative}
.stage canvas{display:block;width:100%;height:auto;aspect-ratio:16/9;touch-action:none;cursor:grab}
.stage-hint{font-size:12px;color:var(--muted);margin:8px 2px 0}
#wave{position:absolute;inset:0;width:100%;height:100%;pointer-events:none;z-index:0}
.lyr{position:absolute;bottom:3px;height:6px;border-radius:3px;background:var(--accent);opacity:.75;z-index:2;pointer-events:none}
.transport{display:flex;align-items:center;gap:12px;margin:12px 0 4px}
.play{width:42px;height:42px;border-radius:50%;border:none;background:var(--text);color:var(--bg);display:grid;place-items:center;flex:none}
.play svg{width:16px;height:16px}
.time{font-variant-numeric:tabular-nums;font-size:13px;color:var(--muted);min-width:92px}
.timeline{position:relative;flex:1;height:46px;display:flex;border-radius:6px;overflow:hidden;background:var(--sunk);border:1px solid var(--line);touch-action:none;cursor:pointer}
.seg{position:relative;z-index:1;height:100%;border-right:1px solid var(--line);font-size:11px;color:var(--muted);padding:3px 5px;overflow:hidden;white-space:nowrap;min-width:0}
.seg:last-child{border-right:none}
@media (max-width:600px){.seg{font-size:0;padding:0}}
.seg.on{background:var(--accent-soft);color:var(--accent)}
.playhead{position:absolute;top:0;bottom:0;width:2px;background:var(--accent);pointer-events:none;left:0}

.strip-head{display:flex;align-items:center;justify-content:space-between;margin:18px 0 8px;gap:12px;flex-wrap:wrap}
.strip-head h2{font-size:15px;margin:0;font-weight:600}
.add-sel{border:1px solid var(--accent);color:var(--accent);background:var(--surface);border-radius:999px;padding:6px 12px;font-weight:500;cursor:pointer}
.add-sel[hidden]{display:none}
.strip-head .note{color:var(--muted);font-size:12.5px;margin-left:auto}
.strip{display:flex;gap:10px;overflow-x:auto;padding:2px 2px 12px;scroll-snap-type:x proximity}
.card{flex:0 0 172px;border:1px solid var(--line);background:var(--surface);border-radius:8px;padding:6px;text-align:left;scroll-snap-align:start}
.card canvas{display:block;width:100%;aspect-ratio:16/9;border-radius:4px;background:#000}
.card .cap{display:flex;justify-content:space-between;gap:6px;margin-top:6px;font-size:12px}
.card .cap span:first-child{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.card .cap span:last-child{color:var(--muted);font-variant-numeric:tabular-nums}
.card.on{border-color:var(--accent);box-shadow:0 0 0 1px var(--accent)}
.add-card{flex:0 0 150px;border:1px dashed var(--line);border-radius:8px;display:flex;flex-direction:column;justify-content:center;gap:8px;padding:12px;color:var(--muted);font-size:12.5px}
.add-card select{width:100%;padding:7px 8px;border-radius:6px;border:1px solid var(--line);background:var(--surface)}

.panel{background:var(--surface);border:1px solid var(--line);border-radius:12px;overflow:hidden}
@media (min-width:981px){.panel{position:sticky;top:calc(env(safe-area-inset-top,0px) + 12px);max-height:calc(100vh - 24px);display:flex;flex-direction:column}}
.tabs{display:flex;border-bottom:1px solid var(--line)}
.tabs button{flex:1;border:none;background:none;padding:12px 4px;font-size:13.5px;font-weight:500;color:var(--muted);border-bottom:2px solid transparent}
.tabs button[aria-selected="true"]{color:var(--text);border-bottom-color:var(--accent)}
.pane{padding:16px 18px 22px;overflow-y:auto}
.pane[hidden]{display:none}
.row{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.scene-title{font:italic 400 26px/1.1 "Cormorant Garamond",Georgia,serif;margin:0 auto 0 0}
.field{display:block;margin-top:14px}
.field>span{display:block;font-size:12.5px;color:var(--muted);margin-bottom:5px}
.field input[type=text],.field input[type=number],.field textarea,.field select{width:100%;border:1px solid var(--line);background:var(--sunk);border-radius:7px;padding:9px 10px}
.field textarea{resize:vertical;min-height:70px;line-height:1.6}
.hint{font-size:12px;color:var(--muted);margin:6px 0 0}
.group{border-top:1px solid var(--line);margin-top:18px;padding-top:6px}
.group>h3{font-size:13px;margin:12px 0 0;font-weight:600}
.slots{display:grid;grid-template-columns:1fr;gap:12px;margin-top:10px}
.slot{display:grid;grid-template-columns:92px minmax(0,1fr);gap:10px;align-items:start}
.mini{display:grid;gap:4px}
.ctl{display:grid;grid-template-columns:34px minmax(0,1fr);align-items:center;gap:6px;font-size:12px;color:var(--muted)}
.ctl input[type=range]{width:100%;accent-color:var(--accent)}
.ctl-row{display:flex;align-items:center;gap:8px;margin-top:6px;font-size:12px;color:var(--muted)}
.ctl-row input[type=range]{flex:1;min-width:0;accent-color:var(--accent)}
.ly-item{border:1px solid var(--line);border-radius:9px;padding:10px;margin-top:10px;background:var(--sunk)}
.ly-item.on{border-color:var(--accent)}
.ly-item textarea{width:100%;border:1px solid var(--line);border-radius:6px;padding:7px 8px;background:var(--surface);min-height:44px;resize:vertical}
.ly-times{display:flex;flex-wrap:wrap;align-items:center;gap:6px;margin-top:8px;font-size:12px;color:var(--muted)}
.tin{width:68px;border:1px solid var(--line);border-radius:6px;padding:4px 6px;background:var(--surface);font-variant-numeric:tabular-nums}
.res{display:grid;gap:8px;margin-top:14px}
.res label{display:flex;gap:10px;align-items:flex-start;border:1px solid var(--line);border-radius:9px;padding:10px 12px;cursor:pointer}
.res label:has(input:checked){border-color:var(--accent);background:var(--accent-soft)}
.res input{accent-color:var(--accent);margin-top:3px}
.res small{display:block;color:var(--muted)}
.slot-btn{position:relative;border:1px dashed var(--line);border-radius:7px;background:var(--sunk);aspect-ratio:1;display:grid;place-items:center;overflow:hidden;padding:0;color:var(--muted);font-size:12px}
.slot-btn img,.slot-btn video{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.slot-btn .badge{position:absolute;left:5px;top:5px;background:rgba(0,0,0,.6);color:#fff;border-radius:4px;padding:0 5px;font-size:11px}
.slot-row{display:flex;align-items:center;gap:6px}
.slot-row input[type=range]{flex:1;min-width:0;accent-color:var(--accent)}
.x{border:none;background:none;color:var(--muted);padding:2px 4px;font-size:12px}
.checks{display:flex;flex-wrap:wrap;gap:8px 16px;margin-top:12px}
.checks label{display:flex;align-items:center;gap:6px;font-size:13.5px}
.checks input{accent-color:var(--accent);width:16px;height:16px}
.len{display:flex;align-items:center;gap:10px}
.len input{max-width:90px}
.tokens{display:flex;flex-wrap:wrap;gap:6px;margin-top:8px}
.tokens code{font:12px/1 "IBM Plex Sans KR",sans-serif;background:var(--sunk);border:1px solid var(--line);border-radius:5px;padding:4px 6px}
.status{font-size:12px;color:var(--muted);margin-top:14px}
.drop{border:1px dashed var(--line);border-radius:10px;padding:16px;text-align:center;color:var(--muted);margin-top:12px}

.modal{position:fixed;inset:0;background:rgba(0,0,0,.55);display:grid;place-items:center;z-index:50;padding:20px}
.modal[hidden]{display:none}
.sheet{background:var(--surface);color:var(--text);border-radius:14px;max-width:440px;width:100%;padding:24px}
.sheet h3{font:italic 400 28px/1.15 "Cormorant Garamond",Georgia,serif;margin:0 0 8px}
.sheet p{margin:6px 0;color:var(--muted)}
.bar{height:6px;background:var(--sunk);border-radius:6px;overflow:hidden;margin:16px 0 8px}
.bar i{display:block;height:100%;width:0;background:var(--accent);transition:width .2s linear}
.sheet .row{margin-top:16px;justify-content:flex-end}
.toast{position:fixed;left:50%;bottom:calc(20px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--text);color:var(--bg);padding:10px 16px;border-radius:8px;font-size:13px;z-index:60;opacity:0;transition:opacity .2s;pointer-events:none;max-width:90vw}
.toast.show{opacity:1}
.btn[hidden],.sync[hidden]{display:none}
.hist{display:inline-flex;gap:4px}
.btn.small.on{border-color:var(--accent);background:var(--accent-soft);color:var(--accent)}
.bgrow{display:flex;flex-wrap:wrap;gap:7px;align-items:center;margin-top:10px}
.bgrow input[type=color]{width:34px;height:28px;border:1px solid var(--line);border-radius:6px;padding:0;background:none}
.vt{font-variant-numeric:tabular-nums;color:var(--text)}
#vidHost{position:fixed;left:0;top:0;width:4px;height:4px;opacity:.01;overflow:hidden;pointer-events:none;z-index:-1}
#vidHost video{width:4px;height:4px}
body.dragging .stage{outline:2px dashed var(--accent);outline-offset:4px}
body.dragging .slot-btn,body.dragging .card{border-color:var(--accent)}
.drop-hot{outline:3px solid var(--accent)!important;outline-offset:2px}
.drop-hint{position:fixed;left:50%;top:calc(env(safe-area-inset-top,0px) + 14px);transform:translateX(-50%);z-index:70;background:var(--accent);color:var(--accent-ink);padding:10px 16px;border-radius:10px;font-size:13.5px;pointer-events:none;max-width:92vw;text-align:center}
.drop-hint[hidden]{display:none}
.sty{margin-top:6px}
.sty summary{cursor:pointer;font-size:12.5px;color:var(--accent);padding:4px 0;width:max-content}
.sty[open] summary{margin-bottom:4px}
.sty .ctl-row span:first-child{min-width:30px}
.sty select{flex:1;min-width:0;border:1px solid var(--line);border-radius:6px;padding:5px 6px;background:var(--surface)}
.sw{display:flex;flex-wrap:wrap;gap:7px;align-items:center}
.swb{width:24px;height:24px;border-radius:50%;border:1px solid var(--line);padding:0}
.swb.on{outline:2px solid var(--accent);outline-offset:2px}
.sw input[type=color]{width:32px;height:26px;border:1px solid var(--line);border-radius:6px;padding:0;background:none}
.hist .btn{padding:7px 10px}
.hist svg{width:16px;height:16px}
.sync{font-size:12.5px;color:var(--muted)}
.lobby{position:fixed;inset:0;background:var(--bg);z-index:40;overflow:auto;padding:calc(env(safe-area-inset-top,0px) + 28px) 20px calc(env(safe-area-inset-bottom,0px) + 28px)}
.lobby[hidden]{display:none}
.st-h{font-size:15px;font-weight:600;margin:30px 0 12px}
.tpl-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(290px,1fr));gap:16px}
.tpl{background:var(--surface);border:1px solid var(--line);border-radius:12px;overflow:hidden;display:flex;flex-direction:column}
.tpl canvas{width:100%;height:auto;aspect-ratio:16/9;display:block;background:#000}
.tpl .b{padding:14px 16px 16px;display:flex;flex-direction:column;gap:8px;flex:1}
.badge2{font:600 12px/1.2 "IBM Plex Sans KR",sans-serif;color:var(--accent);letter-spacing:.06em}
.tpl h3{font-size:18px;font-weight:600;margin:0}
.tpl p{color:var(--muted);font-size:13px;margin:0;line-height:1.6}
.tagrow{display:flex;flex-wrap:wrap;gap:6px}
.tagrow span{font-size:12px;border:1px solid var(--line);border-radius:999px;padding:3px 9px;color:var(--muted)}
.st-drop{border:1.5px dashed var(--line);border-radius:12px;padding:26px;text-align:center;background:var(--surface)}
.st-drop p{color:var(--muted);margin:0 0 12px}
.resume{background:var(--surface);border:1px solid var(--accent);border-radius:12px;padding:16px 18px;display:flex;align-items:center;gap:14px;margin-top:22px;flex-wrap:wrap}
.lobby-in{max-width:760px;margin:0 auto}
.plist{display:grid;gap:10px;margin-top:16px}
.pitem{display:flex;align-items:center;gap:10px;background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:14px 16px}
.pitem .grow{flex:1;min-width:0}
.pitem .t{font-weight:600;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.pitem .m{font-size:12.5px;color:var(--muted)}
.login{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:22px;max-width:420px;margin-top:22px}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)}
@media (prefers-reduced-motion: reduce){.bar i,.toast{transition:none}}
</style>
</head>
<body>

<header class="top">
  <button class="btn small ghost" id="backBtn" hidden>목록</button>
  <div class="brand"><b>Prelude</b><span id="brandSub">식전영상 클래식 모던 템플릿</span></div>
  <span class="sync" id="sync" hidden></span>
  <div class="hist">
    <button class="btn ghost" id="undoBtn" title="실행 취소 (Ctrl+Z, 맥은 ⌘+Z)" aria-label="실행 취소" disabled><svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><path d="M5.5 3 2.5 6l3 3"/><path d="M2.5 6h7a4 4 0 0 1 0 8H6"/></svg></button>
    <button class="btn ghost" id="redoBtn" title="다시 실행 (Ctrl+Shift+Z, 맥은 ⌘+Shift+Z)" aria-label="다시 실행" disabled><svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><path d="M10.5 3l3 3-3 3"/><path d="M13.5 6h-7a4 4 0 0 0 0 8H10"/></svg></button>
  </div>
  <div class="audio-chip" id="audioChip"><span>음원이 없어요</span></div>
  <label class="btn"><input type="file" accept="audio/*,.mp3,.m4a,.aac,.wav,.ogg,.flac" id="audioInput" class="sr">음원 넣기</label>
  <button class="btn" id="homeBtn">처음 화면</button>
  <button class="btn" id="saveWorkBtn">작업 저장</button>
  <button class="btn primary" id="exportBtn">영상 만들기</button>
</header>

<main class="app">
  <section>
    <div class="stage"><canvas id="view" width="1920" height="1080" aria-label="영상 미리보기. 사진이나 글씨를 끌어서 옮길 수 있어요"></canvas></div>
    <p class="stage-hint">미리보기에서 사진이나 글씨를 끌어 옮기세요. 마우스 휠이나 두 손가락으로 크기를 바꿀 수 있어요.</p>
    <div class="transport">
      <button class="play" id="playBtn" aria-label="재생"><svg viewBox="0 0 16 16" id="playIcon"><path d="M3 1.5v13l11-6.5z" fill="currentColor"/></svg></button>
      <span class="time" id="timeLabel">0:00 / 0:00</span>
      <div class="timeline" id="timeline" role="slider" aria-label="재생 위치" tabindex="0"><canvas id="wave"></canvas><div class="playhead" id="playhead"></div></div>
    </div>
    <div class="strip-head">
      <h2>장면</h2>
      <select id="addScene" class="add-sel" aria-label="선택한 장면 뒤에 장면 추가"></select>
      <span class="note" id="scaleNote"></span>
      <button class="btn small" id="autoFit" hidden title="장면 길이 비율은 그대로 두고, 전체가 음원 길이와 같아지도록 나눠요">음원 길이에 맞춰 자동 분배</button>
    </div>
    <div class="strip" id="strip"></div>
  </section>

  <aside class="panel">
    <div class="tabs" role="tablist" id="tabs"></div>
    <div class="pane" id="pane-scene"></div>
    <div class="pane" id="pane-info" hidden></div>
    <div class="pane" id="pane-lyrics" hidden></div>
    <div class="pane" id="pane-file" hidden></div>
  </aside>
</main>

<div class="lobby" id="lobby" hidden>
  <div class="lobby-in">
    <div class="brand"><b>Prelude</b><span>함께 편집하는 식전영상 작업실</span></div>
    <div id="lobbyBody"></div>
  </div>
</div>

<div class="lobby" id="start" hidden>
  <div class="lobby-in" style="max-width:1080px">
    <div class="brand"><b>Prelude</b><span>식전영상 에디터</span></div>
    <div id="startResume"></div>
    <h2 class="st-h">새로 만들기</h2>
    <div class="tpl-grid" id="tplGrid"></div>
    <h2 class="st-h">작업 파일로 이어서 하기</h2>
    <div class="st-drop"><p>저장해 둔 작업 파일(.prelude)을 이 화면에 끌어다 놓거나</p><button class="btn primary" id="startLoad">작업 파일 고르기</button></div>
  </div>
</div>

<div class="modal" id="modal" hidden>
  <div class="sheet" role="dialog" aria-modal="true" aria-labelledby="mTitle">
    <h3 id="mTitle"></h3>
    <div id="mBody"></div>
    <div class="row" id="mActions"></div>
  </div>
</div>
<div class="toast" id="toast" role="status"></div>
<div id="vidHost" aria-hidden="true"></div>
<div class="drop-hint" id="dropHint" hidden>여기에 놓으면 빈 사진 칸에 순서대로 들어가요. 사진 칸이나 미리보기 위에 놓으면 그 자리에 들어가요.</div>

<input type="file" id="slotInput" accept="image/*,video/*" class="sr">
<input type="file" id="bulkInput" accept="image/*,video/*" multiple class="sr">
<input type="file" id="tplInput" accept=".json,application/json" class="sr">

/* template save / load */
async function getDownloads() {
  try { if (window.claude && typeof window.claude.use === 'function') return await window.claude.use('downloads'); } catch (e) {}
  return null;
}
async function saveFile(blob, filename) {
  const dl = await getDownloads();

    try { await dl.save({ filename, data: blob }); toast('저장했어요'); return true; }
    catch (e) {
      if (e && e.code === 'declined') { toast('저장을 취소했어요'); return false; }
      if (e && e.code === 'rate_limited') { toast('잠시 후 다시 눌러주세요'); return false; }
      if (e && e.code === 'too_large') { toast('파일이 너무 커요. FHD로 다시 만들어 주세요.'); return false; }
    }
  }
  try {
    const a = document.createElement('a'); a.href = URL.createObjectURL(blob); a.download = filename;
    document.body.appendChild(a); a.click(); a.remove();
    setTimeout(() => URL.revokeObjectURL(a.href), 60000);
    return true;
  } catch (e) { toast('이 화면에서는 파일을 저장할 수 없어요'); return false; }
}

  }

async function restore() {
  idb = await openDB(); storageOK = !!idb;
  const p = idb && await idbGet('project');
  project = normalize((p && p.scenes) ? p : defaultProject());
  if (!idb) return;
  const ids = new Set(); project.scenes.forEach(s => s.media.forEach(m => m.id && ids.add(m.id)));
  for (const id of ids) {
    const rec = await idbGet('media:' + id);
    if (rec && rec.blob) { try { await makeMedia(id, rec.blob, rec.type); } catch (e) { } }
  }
  project.scenes.forEach(s => s.media.forEach((m, k) => { if (m.id && !media[m.id]) s.media[k] = { id: null }; }));
  const keys = (await idbKeys()) || [];
  keys.filter(k => typeof k === 'string' && k.startsWith('media:') && !ids.has(k.slice(6))).forEach(k => idbDel(k));
  const a = await idbGet('audio');
  if (a && a.blob) {
    try { abuf = await decode(await a.blob.arrayBuffer()); audioName = a.name || '음원'; audioBlob = a.blob; computePeaks(); } catch (e) { abuf = null; }
  }
}

  const dirEntries = [...(e.dataTransfer.items || [])].map(it => it.webkitGetAsEntry ? it.webkitGetAsEntry() : null).filter(Boolean);
  let all = [...e.dataTransfer.files];
  if (dirEntries.some(en => en.isDirectory)) all = await readEntries(dirEntries);
  const isWork = all.find(f => /\.(prelude|zip)$/i.test(f.name || '')) || all.find(f => /^project\.json$/i.test(f.name || ''));
  if (isWork) { askReplace('작업 파일을 불러올까요?', () => loadWork(all)); return; }
  const audio = all.find(isAudioFile);
  if (audio) { getCtx(); await loadAudioFile(audio); }
  const files = all.filter(isMediaFile);
  if (!files.length) { if (!audio) toast('사진, 영상, 음원 파일을 놓아주세요'); return; }
  if (tgt.kind === 'slot') {
    const s = project.scenes[sel]; if (!s) return;
    try { s.media[tgt.si] = await importFile(files[0]); sceneChanged(s); buildSlots(s); }
    catch (err) { toast('이 파일은 열 수 없어요. JPG, PNG, MP4로 바꿔서 넣어주세요.'); }
    if (files.length > 1) await bulkFill(files.slice(1));
    return;
  }
  if (tgt.kind === 'view') {
    if (dirty) render(PR, curT, true);
    const r = view.getBoundingClientRect();
    const pnt = { x: (e.clientX - r.left) / r.width * W, y: (e.clientY - r.top) / r.height * H };
    const h = (hits || []).filter(h => h.type === 'media' && pnt.x >= h.x && pnt.x <= h.x + h.w && pnt.y >= h.y && pnt.y <= h.y + h.h).sort((a, b) => a.w * a.h - b.w * b.h)[0];
    if (h) {
      const s = project.scenes[h.idx];
      if (h.idx !== sel) select(h.idx);
      try { s.media[h.si] = await importFile(files[0]); sceneChanged(s); buildScenePane(); }
      catch (err) { toast('이 파일은 열 수 없어요. JPG, PNG, MP4로 바꿔서 넣어주세요.'); }
      if (files.length > 1) await bulkFill(files.slice(1));
      return;
    }
    const cur = project.scenes[sceneAt(curT)];
    await bulkFill(files, cur && cur.media.some(m => !m.id) ? [cur, ...project.scenes] : null);
    return;
  }
  if (tgt.kind === 'card') {
    const i = project.scenes.findIndex(x => x.id === tgt.id);
    if (i >= 0) { select(i); await bulkFill(files, [project.scenes[i], ...project.scenes]); return; }
  }
  await bulkFill(files);
});

/* ---------------- start screen: pick A / B / C or continue a work file ---------------- */
function tplPreview(type, cv) {
  const keep = project, kT = timeline, kTot = total, kSpan = span, kc = collectVideos;
  try {
    project = normalize(TEMPLATES[type].make()); computeTimeline();
    const idx = TEMPLATES[type].preview || 0;
    R = TR; const c = TR.ctx; c.setTransform(TR.S, 0, 0, TR.S, 0, 0); c.globalAlpha = 1; activeLyric = null; collectVideos = false;
    drawScene(c, idx, timeline[idx].dur * 0.8, false);
    cv.getContext('2d').drawImage(TR.canvas, 0, 0, cv.width, cv.height);
  } catch (e) {} finally { project = keep; timeline = kT; total = kTot; span = kSpan; collectVideos = kc; }
}
function showStart() {
  if (TEAM || CUSTOMER) return;
  pause();
  $('start').hidden = false;
  const r = $('startResume');
  if (!workIsEmpty()) {
    const i = project.info;
    r.innerHTML = `<div class="resume"><div style="flex:1;min-width:220px"><div class="badge2">${project.tpl ? esc(project.tpl) + '타입 ' : ''}작업 중</div>
      <div style="font-weight:600;font-size:17px;margin-top:4px">${esc(i.groomKo || '')}, ${esc(i.brideKo || '')} 식전영상</div>
      <div class="hint" style="margin:2px 0 0">장면 ${project.scenes.length}개. 이 브라우저에 자동 보관된 작업이에요.</div></div>
      <button class="btn primary" id="resumeBtn">이어서 작업하기</button></div>`;
    $('resumeBtn').onclick = hideStart;
  } else r.innerHTML = '';
  $('tplGrid').innerHTML = Object.entries(TEMPLATES).map(([k, T]) => `<div class="tpl"><canvas width="480" height="270" data-tp="${k}"></canvas><div class="b">
    <div class="badge2">${k}타입</div><h3>${esc(T.name)}</h3><p>${esc(T.desc)}</p>
    <div class="tagrow">${T.tags.map(x => `<span>${esc(x)}</span>`).join('')}</div>
    <button class="btn small primary" data-start="${k}" style="align-self:flex-start;margin-top:6px">${k}타입으로 시작</button></div></div>`).join('');
  document.querySelectorAll('[data-tp]').forEach(cv => tplPreview(cv.dataset.tp, cv));
  document.querySelectorAll('[data-start]').forEach(b => b.onclick = () => {
    const k = b.dataset.start;
    if (workIsEmpty()) startNew(k); else askReplace(`${k}타입으로 새로 시작할까요?`, () => startNew(k));
  });
}
function hideStart() { $('start').hidden = true; dirty = true; }
async function startNew(type) {
  pause(); workBusy = true;
  try {
    await backupCurrent();
    if (idb) for (const k of (await idbKeys()) || []) if (typeof k === 'string' && (k.startsWith('media:') || k === 'audio')) await idbDel(k);
    for (const id in media) { if (media[id].url.startsWith('blob:')) URL.revokeObjectURL(media[id].url); delete media[id]; }
    abuf = null; peaks = null; audioName = ''; audioBlob = null;
    project = normalize(TEMPLATES[type].make()); sel = 0; curT = 0; editSel = null;
    onAudioReady(); buildInfoPane(); buildLyricPane(); buildFilePane(); loadFontsFor(allText()); save(); resetHistory();
    hideStart(); toast(`${type}타입 템플릿으로 시작해요. 사진을 끌어다 놓아 채워보세요`);
  } finally { workBusy = false; }
}
$('startLoad').onclick = () => { $('workInput').value = ''; $('workInput').click(); };
$('homeBtn').onclick = showStart;

/* ---------------- undo / redo ---------------- */
const undoStack = [], redoStack = [];
let lastSnap = null, commitTimer = null, histMute = false;
const clone = o => JSON.parse(JSON.stringify(o));
function resetHistory() { undoStack.length = 0; redoStack.length = 0; clearTimeout(commitTimer); lastSnap = clone(project); updateHistButtons(); }
function diffKeys(a, b) {
  const k = new Set(), J = JSON.stringify;
  if (a.scenes.map(s => s.id).join(',') !== b.scenes.map(s => s.id).join(',')) k.add('order');
  const am = new Map(a.scenes.map(s => [s.id, J(s)])), bIds = new Set(b.scenes.map(s => s.id));
  b.scenes.forEach(s => { if (am.get(s.id) !== J(s)) k.add(s.id); });
  a.scenes.forEach(s => { if (!bIds.has(s.id)) k.add(s.id); });
  if (J(a.info) !== J(b.info) || (a.title || '') !== (b.title || '')) k.add('info');
  if (J(a.lyrics) !== J(b.lyrics) || a.lyricsOn !== b.lyricsOn || J(a.lstyle) !== J(b.lstyle) || a.lyricFx !== b.lyricFx || a.lcol !== b.lcol || a.lcol2 !== b.lcol2) k.add('lyrics');
  if (J(a.audio || null) !== J(b.audio || null)) k.add('audio');
  return k;
}
function scheduleCommit() { clearTimeout(commitTimer); commitTimer = setTimeout(commitNow, 600); }
function commitNow() {
  clearTimeout(commitTimer);
  if (!project) return;
  const cur = clone(project);
  if (!lastSnap) { lastSnap = cur; return; }
  const keys = diffKeys(lastSnap, cur);
  if (!keys.size) return;
  undoStack.push({ before: lastSnap, after: cur, keys: [...keys] });
  if (undoStack.length > 100) undoStack.shift();
  redoStack.length = 0; lastSnap = cur; updateHistButtons();
}
function updateHistButtons() {
  const u = $('undoBtn'), r = $('redoBtn');
  if (u) u.disabled = !undoStack.length;
  if (r) r.disabled = !redoStack.length;
}
async function applyHistory(target, keys) {
  if (playing) pause();
  histMute = true;
  try {
    const k = new Set(keys);
    project = normalize(mergeProjects(target, project, k));
    keys.forEach(x => touch(x));
    if (TEAM) { await ensureAudio(); ensureMedia(); }
    computeTimeline(); buildStrip(); buildTimeline(); updateScaleNote();
    select(Math.min(sel, project.scenes.length - 1));
    buildInfoPane(); buildLyricPane(); buildFilePane(); updateAudioInfo();
    lastSnap = clone(project); dirty = true;
    save();
  } finally { histMute = false; }
  updateHistButtons();
}
async function undo() {
  if (exporting) return;
  commitNow();
  const e = undoStack.pop();
  if (!e) { toast('되돌릴 작업이 없어요'); return; }
  redoStack.push(e);
  await applyHistory(e.before, e.keys);
  toast('실행 취소했어요');
}
async function redo() {
  if (exporting) return;
  commitNow();
  const e = redoStack.pop();
  if (!e) { toast('다시 실행할 작업이 없어요'); return; }
  undoStack.push(e);
  await applyHistory(e.after, e.keys);
  toast('다시 실행했어요');
}
$('undoBtn').onclick = undo;
$('redoBtn').onclick = redo;
document.addEventListener('keydown', e => {
  if (!(e.ctrlKey || e.metaKey) || e.altKey) return;
  const isZ = e.code === 'KeyZ' || (e.key || '').toLowerCase() === 'z';
  const isY = e.code === 'KeyY' || (e.key || '').toLowerCase() === 'y';
  if (!isZ && !isY) return;
  const a = document.activeElement;
  if (a && /INPUT|TEXTAREA/.test(a.tagName) && !/range|checkbox|radio/.test(a.type || '')) return; // 글씨 칸 안에서는 브라우저 기본 되돌리기
  if (!$('modal').hidden || !$('lobby').hidden || !$('start').hidden) return;
  e.preventDefault();
  if ((isZ && e.shiftKey) || isY) redo(); else undo();
});

/* ---------------- auto-fit scene lengths to the music ---------------- */
function autoFit() {
  if (!abuf) { toast('음원을 먼저 넣어주세요'); return; }
  const sc = project.scenes; if (!sc.length) return;
  const target = Math.round(abuf.duration * 10) / 10;
  const sum = sc.reduce((n, s) => n + Math.max(0.5, +s.weight || 1), 0);
  let acc = 0;
  sc.forEach((s, i) => {
    if (i === sc.length - 1) s.weight = Math.max(0.5, Math.round((target - acc) * 10) / 10);
    else { s.weight = Math.max(0.5, Math.round(Math.max(0.5, +s.weight || 1) * target / sum * 10) / 10); acc += s.weight; }
    touch(s.id);
  });
  changed(true); select(sel);
  toast(`장면 ${sc.length}개를 음원 길이 ${fmt1(abuf.duration)}에 맞춰 나눴어요`);
}
$('autoFit').onclick = autoFit;

/* ---------------- wiring ---------------- */
$('playBtn').onclick = () => { if (exporting) return; if (abuf) getCtx(); playing ? pause() : play(); };
const tl = $('timeline');
function tlSeek(e) {
  const r = tl.getBoundingClientRect(); const T = Math.min(total, clamp((e.clientX - r.left) / r.width) * span);
  seek(T); const i = sceneAt(T); if (i !== sel) select(i);
}
tl.addEventListener('pointerdown', e => { if (exporting) return; tl.setPointerCapture(e.pointerId); tlSeek(e); tl.onpointermove = tlSeek; });
tl.addEventListener('pointerup', () => { tl.onpointermove = null; });
tl.addEventListener('keydown', e => {
  if (exporting) return;
  if (e.key === 'ArrowRight') { seek(curT + 2); e.preventDefault(); }
  if (e.key === 'ArrowLeft') { seek(curT - 2); e.preventDefault(); }
});
document.addEventListener('keydown', e => {
  if (e.code === 'Space' && !/INPUT|TEXTAREA|SELECT|BUTTON/.test(document.activeElement.tagName) && !exporting) { e.preventDefault(); playing ? pause() : play(); }
  if (e.key === 'Escape' && !exporting && !$('modal').hidden) $('modal').hidden = true;
});

(async function init() {
  if (CUSTOMER) { $('brandSub').textContent = '우리만의 식전영상 만들기'; document.title = '식전영상 만들기'; }
  buildTabs();
  BASE_TPL = await fetchTemplate();
  project = normalize(defaultProject()); computeTimeline(); render(PR, 0, true);
  if (TEAM) {
    buildStrip(); buildTimeline(); updateScaleNote(); select(0); buildInfoPane(); buildLyricPane(); buildFilePane();
    requestAnimationFrame(loop); initTeam(); return;
  }
  await restore();
  computeTimeline(); buildStrip(); buildTimeline(); updateScaleNote(); select(0);
  buildInfoPane(); buildLyricPane(); buildFilePane(); updateAudioInfo();
  loadFontsFor(allText());
  resetHistory();
  if (!CUSTOMER) showStart();
  if (document.fonts) document.fonts.ready.then(() => { project.scenes.forEach(s => queueThumb(s.id)); dirty = true; if (!$('start').hidden) document.querySelectorAll('[data-tp]').forEach(cv => tplPreview(cv.dataset.tp, cv)); });
  dirty = true; requestAnimationFrame(loop);
})();
})();
